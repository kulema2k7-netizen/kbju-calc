<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NutriPlan — Калькулятор КБЖУ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    .tab-active { background-color: #2563eb; color: white; }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- Шапка -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight">🥗 NutriPlan КБЖУ</h1>
      <button onclick="resetAll()" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition">Сбросить день</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-6">

    <!-- Блок 1: Параметры и цель -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">⚙️ Ваши параметры</h2>
        <span id="bmi-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100">ИМТ: --</span>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm">
        <div>
          <label class="block text-slate-500 mb-1">Пол</label>
          <select id="gender" onchange="saveProfile()" class="w-full p-2.5 border rounded-xl bg-slate-50">
            <option value="male">Мужской</option>
            <option value="female">Женский</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-500 mb-1">Возраст (лет)</label>
          <input type="number" id="age" value="35" oninput="saveProfile()" class="w-full p-2.5 border rounded-xl bg-slate-50">
        </div>
        <div>
          <label class="block text-slate-500 mb-1">Рост (см)</label>
          <input type="number" id="height" value="188" oninput="saveProfile()" class="w-full p-2.5 border rounded-xl bg-slate-50">
        </div>
        <div>
          <label class="block text-slate-500 mb-1">Вес (кг)</label>
          <input type="number" id="weight" value="85" oninput="saveProfile()" class="w-full p-2.5 border rounded-xl bg-slate-50">
        </div>
        <div>
          <label class="block text-slate-500 mb-1">Активность</label>
          <select id="activity" onchange="saveProfile()" class="w-full p-2.5 border rounded-xl bg-slate-50">
            <option value="1.2">Минимальная (сидячая)</option>
            <option value="1.375" selected>Лёгкая (1-3 трен./нед)</option>
            <option value="1.55">Средняя (3-5 трен./нед)</option>
            <option value="1.725">Высокая (6-7 трен./нед)</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-500 mb-1">Цель</label>
          <select id="goal" onchange="saveProfile()" class="w-full p-2.5 border rounded-xl bg-slate-50">
            <option value="0.85">Снижение веса (-15%)</option>
            <option value="1" selected>Поддержание формы</option>
            <option value="1.15">Набор массы (+15%)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Блок 2: Прогресс за день -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-lg font-bold mb-4">📊 Итоги за день</h2>
      
      <!-- Калории -->
      <div class="mb-4">
        <div class="flex justify-between text-sm font-medium mb-1">
          <span>Калории</span>
          <span><b id="cur-kcal">0</b> / <span id="norm-kcal">0</span> ккал</span>
        </div>
        <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
          <div id="bar-kcal" class="bg-blue-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- БЖУ -->
      <div class="grid grid-cols-3 gap-3 text-center">
        <div class="bg-amber-50 p-3 rounded-xl border border-amber-100">
          <div class="text-xs text-amber-700 font-medium">Белки</div>
          <div class="text-base font-bold text-amber-900 mt-0.5"><span id="cur-p">0</span> / <span id="norm-p">0</span> г</div>
          <div class="w-full bg-amber-200 h-1.5 rounded-full mt-2 overflow-hidden">
            <div id="bar-p" class="bg-amber-500 h-full" style="width: 0%"></div>
          </div>
        </div>
        <div class="bg-yellow-50 p-3 rounded-xl border border-yellow-100">
          <div class="text-xs text-yellow-700 font-medium">Жиры</div>
          <div class="text-base font-bold text-yellow-900 mt-0.5"><span id="cur-f">0</span> / <span id="norm-f">0</span> г</div>
          <div class="w-full bg-yellow-200 h-1.5 rounded-full mt-2 overflow-hidden">
            <div id="bar-f" class="bg-yellow-500 h-full" style="width: 0%"></div>
          </div>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
          <div class="text-xs text-emerald-700 font-medium">Углеводы</div>
          <div class="text-base font-bold text-emerald-900 mt-0.5"><span id="cur-c">0</span> / <span id="norm-c">0</span> г</div>
          <div class="w-full bg-emerald-200 h-1.5 rounded-full mt-2 overflow-hidden">
            <div id="bar-c" class="bg-emerald-500 h-full" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Блок 3: Дневник питания -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-lg font-bold mb-3">🍽 Рацион по приёмам пищи</h2>

      <!-- Табы приёмов пищи -->
      <div class="grid grid-cols-4 gap-1.5 bg-slate-100 p-1 rounded-xl mb-4 text-xs sm:text-sm font-medium">
        <button onclick="setMeal('breakfast')" id="tab-breakfast" class="py-2 rounded-lg transition tab-active">Завтрак</button>
        <button onclick="setMeal('lunch')" id="tab-lunch" class="py-2 rounded-lg transition">Обед</button>
        <button onclick="setMeal('dinner')" id="tab-dinner" class="py-2 rounded-lg transition">Ужин</button>
        <button onclick="setMeal('snack')" id="tab-snack" class="py-2 rounded-lg transition">Перекус</button>
      </div>

      <!-- Форма добавления в текущий приём -->
      <div class="flex flex-col sm:flex-row gap-2 mb-4">
        <select id="food-select" class="flex-1 p-2.5 border rounded-xl bg-slate-50 text-sm"></select>
        <div class="flex gap-2">
          <input type="number" id="food-grams" value="150" placeholder="Вес (г)" class="w-28 p-2.5 border rounded-xl bg-slate-50 text-sm">
          <button onclick="addEntry()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition flex-1 sm:flex-none">
            + Добавить
          </button>
        </div>
      </div>

      <!-- Список съеденного -->
      <div id="meal-list" class="space-y-2 text-sm"></div>
    </section>

    <!-- Блок 4: Свой продукт -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-base font-bold mb-3">➕ Добавить свой продукт в базу (на 100 г)</h2>
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-sm">
        <input type="text" id="new-name" placeholder="Название" class="col-span-2 sm:col-span-1 p-2 border rounded-xl bg-slate-50">
        <input type="number" id="new-kcal" placeholder="Ккал" class="p-2 border rounded-xl bg-slate-50">
        <input type="number" id="new-p" placeholder="Белки (г)" class="p-2 border rounded-xl bg-slate-50">
        <input type="number" id="new-f" placeholder="Жиры (г)" class="p-2 border rounded-xl bg-slate-50">
        <input type="number" id="new-c" placeholder="Углеводы (г)" class="p-2 border rounded-xl bg-slate-50">
      </div>
      <button onclick="addCustomFood()" class="mt-3 w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition">
        Сохранить продукт в список
      </button>
    </section>

  </main>

  <script>
    const defaultFoods = [
      { id: 1, name: 'Куриная грудка (филе)', kcal: 113, p: 23.6, f: 1.9, c: 0.4 },
      { id: 2, name: 'Говядина тушеная/отварная', kcal: 187, p: 25.8, f: 9.5, c: 0 },
      { id: 3, name: 'Яйцо куриное (1 шт ≈ 55г)', kcal: 157, p: 12.7, f: 11.5, c: 0.7 },
      { id: 4, name: 'Гречка отварная', kcal: 110, p: 4.2, f: 1.1, c: 21.3 },
      { id: 5, name: 'Рис белый отварной', kcal: 116, p: 2.2, f: 0.5, c: 24.9 },
      { id: 6, name: 'Овсянка на воде', kcal: 88, p: 3.0, f: 1.7, c: 15.0 },
      { id: 7, name: 'Творог 5%', kcal: 121, p: 17.2, f: 5.0, c: 1.8 },
      { id: 8, name: 'Сыр твёрдый (45%)', kcal: 350, p: 24.0, f: 28.0, c: 0 },
      { id: 9, name: 'Хлеб ржаной / цельнозерновой', kcal: 214, p: 6.6, f: 1.2, c: 43.4 },
      { id: 10, name: 'Картофель отварной/запечённый', kcal: 82, p: 2.0, f: 0.4, c: 16.7 },
      { id: 11, name: 'Банан', kcal: 96, p: 1.5, f: 0.5, c: 21.0 },
      { id: 12, name: 'Яблоко', kcal: 47, p: 0.4, f: 0.4, c: 9.8 },
      { id: 13, name: 'Огурцы / Помидоры (салат)', kcal: 20, p: 0.8, f: 0.2, c: 3.5 },
      { id: 14, name: 'Масло подсолнечное / оливковое', kcal: 899, p: 0, f: 99.9, c: 0 }
    ];

    let state = {
      profile: { gender: 'male', age: 35, height: 188, weight: 85, activity: 1.375, goal: 1 },
      currentMeal: 'breakfast',
      foods: [...defaultFoods],
      log: { breakfast: [], lunch: [], dinner: [], snack: [] }
    };

    function init() {
      const saved = localStorage.getItem('nutriplan_state_v1');
      if (saved) {
        try { state = JSON.parse(saved); } catch (e) {}
      }
      document.getElementById('gender').value = state.profile.gender;
      document.getElementById('age').value = state.profile.age;
      document.getElementById('height').value = state.profile.height;
      document.getElementById('weight').value = state.profile.weight;
      document.getElementById('activity').value = state.profile.activity;
      document.getElementById('goal').value = state.profile.goal;

      renderFoodSelect();
      updateAll();
    }

    function saveState() {
      localStorage.setItem('nutriplan_state_v1', JSON.stringify(state));
    }

    function saveProfile() {
      state.profile = {
        gender: document.getElementById('gender').value,
        age: +document.getElementById('age').value || 30,
        height: +document.getElementById('height').value || 175,
        weight: +document.getElementById('weight').value || 75,
        activity: +document.getElementById('activity').value || 1.375,
        goal: +document.getElementById('goal').value || 1
      };
      saveState();
      updateAll();
    }

    function calcNorms() {
      const { gender, age, height, weight, activity, goal } = state.profile;
      const bmr = (10 * weight) + (6.25 * height) - (5 * age) + (gender === 'male' ? 5 : -161);
      const targetKcal = Math.round(bmr * activity * goal);
      const p = Math.round((targetKcal * 0.3) / 4);
      const f = Math.round((targetKcal * 0.3) / 9);
      const c = Math.round((targetKcal * 0.4) / 4);
      const bmi = (weight / Math.pow(height / 100, 2)).toFixed(1);
      return { targetKcal, p, f, c, bmi };
    }

    function renderFoodSelect() {
      const sel = document.getElementById('food-select');
      sel.innerHTML = state.foods.map(f => 
        `<option value="${f.id}">${f.name} (${f.kcal} ккал / 100г)</option>`
      ).join('');
    }

    function setMeal(meal) {
      state.currentMeal = meal;
      ['breakfast', 'lunch', 'dinner', 'snack'].forEach(m => {
        const btn = document.getElementById('tab-' + m);
        btn.className = m === meal ? 'py-2 rounded-lg transition tab-active' : 'py-2 rounded-lg transition text-slate-600';
      });
      renderMealList();
    }

    function addEntry() {
      const foodId = +document.getElementById('food-select').value;
      const grams = +document.getElementById('food-grams').value;
      if (!grams || grams <= 0) return;

      const food = state.foods.find(f => f.id === foodId);
      if (!food) return;

      const ratio = grams / 100;
      state.log[state.currentMeal].push({
        uid: Date.now(),
        name: food.name,
        grams,
        kcal: Math.round(food.kcal * ratio),
        p: +(food.p * ratio).toFixed(1),
        f: +(food.f * ratio).toFixed(1),
        c: +(food.c * ratio).toFixed(1)
      });

      saveState();
      updateAll();
    }

    function removeEntry(uid) {
      state.log[state.currentMeal] = state.log[state.currentMeal].filter(i => i.uid !== uid);
      saveState();
      updateAll();
    }

    function addCustomFood() {
      const name = document.getElementById('new-name').value.trim();
      const kcal = +document.getElementById('new-kcal').value;
      const p = +document.getElementById('new-p').value || 0;
      const f = +document.getElementById('new-f').value || 0;
      const c = +document.getElementById('new-c').value || 0;

      if (!name || !kcal) {
        alert('Укажите название и калорийность продукта');
        return;
      }

      state.foods.unshift({ id: Date.now(), name, kcal, p, f, c });
      document.getElementById('new-name').value = '';
      document.getElementById('new-kcal').value = '';
      document.getElementById('new-p').value = '';
      document.getElementById('new-f').value = '';
      document.getElementById('new-c').value = '';

      saveState();
      renderFoodSelect();
    }

    function resetAll() {
      if (confirm('Очистить записи о съеденном за сегодня?')) {
        state.log = { breakfast: [], lunch: [], dinner: [], snack: [] };
        saveState();
        updateAll();
      }
    }

    function renderMealList() {
      const list = document.getElementById('meal-list');
      const items = state.log[state.currentMeal];
      if (!items.length) {
        list.innerHTML = `<div class="text-slate-400 text-center py-4">В этом приёме пищи пока пусто</div>`;
        return;
      }
      list.innerHTML = items.map(i => `
        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
          <div>
            <div class="font-medium">${i.name} <span class="text-slate-400 font-normal">(${i.grams} г)</span></div>
            <div class="text-xs text-slate-500 mt-0.5">
              <b>${i.kcal} ккал</b> • Б: ${i.p}г • Ж: ${i.f}г • У: ${i.c}г
            </div>
          </div>
          <button onclick="removeEntry(${i.uid})" class="text-red-500 hover:bg-red-50 p-1.5 rounded-lg text-xs font-bold">✕</button>
        </div>
      `).join('');
    }

    function updateAll() {
      const norms = calcNorms();
      document.getElementById('norm-kcal').textContent = norms.targetKcal;
      document.getElementById('norm-p').textContent = norms.p;
      document.getElementById('norm-f').textContent = norms.f;
      document.getElementById('norm-c').textContent = norms.c;
      document.getElementById('bmi-badge').textContent = `ИМТ: ${norms.bmi}`;

      let curKcal = 0, curP = 0, curF = 0, curC = 0;
      Object.values(state.log).flat().forEach(i => {
        curKcal += i.kcal;
        curP += i.p;
        curF += i.f;
        curC += i.c;
      });

      document.getElementById('cur-kcal').textContent = Math.round(curKcal);
      document.getElementById('cur-p').textContent = Math.round(curP);
      document.getElementById('cur-f').textContent = Math.round(curF);
      document.getElementById('cur-c').textContent = Math.round(curC);

      document.getElementById('bar-kcal').style.width = Math.min(100, (curKcal / norms.targetKcal) * 100) + '%';
      document.getElementById('bar-p').style.width = Math.min(100, (curP / norms.p) * 100) + '%';
      document.getElementById('bar-f').style.width = Math.min(100, (curF / norms.f) * 100) + '%';
      document.getElementById('bar-c').style.width = Math.min(100, (curC / norms.c) * 100) + '%';

      renderMealList();
    }

    init();
  </script>
</body>
</html>
